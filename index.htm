<style>

html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,serif;overflow:hidden}

#bar{display:flex;gap:16px;align-items:center;padding:10px 0 14px;font-size:14px}
#bar button{background:none;border:1px solid #eedcc766;color:var(--fg);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
var pf=new St.PageFlip(document.getElementById('book'),{
 width:910,height:910,size:'stretch',minWidth:260,maxWidth:1000,minHeight:260,maxHeight:1000,
 showCover:true,usePortrait:true,maxShadowOpacity:.5,mobileScrollSupport:false,drawShadow:true,flippingTime:800});
pf.loadFromHTML(document.querySelectorAll('.page'));
var info=document.getElementById('info'),T=pf.getPageCount();
function up(){info.textContent=(pf.getCurrentPageIndex()+1)+' / '+T}
pf.on('flip',up);
document.getElementById('prev').onclick=function(){pf.flipPrev()};
document.getElementById('next').onclick=function(){pf.flipNext()};
addEventListener('keydown',function(e){if(e.key==='ArrowLeft')pf.flipPrev();if(e.key==='ArrowRight')pf.flipNext()});
